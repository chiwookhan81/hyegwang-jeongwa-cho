<script>
// ===================== 학생 진도 저장 (이 기기에만) =====================
// 고른 학생 이름별로 진도를 이 기기에만 저장해요. 밖으로 보내지 않아요.
(function () {
  const APP = window.SYNC_APP, KEYS = window.SYNC_KEYS || [];
  const LS = window.localStorage, SS = window.sessionStorage;
  const rawSet = Storage.prototype.setItem, rawGet = Storage.prototype.getItem, rawDel = Storage.prototype.removeItem;
  const g = k => { try { return rawGet.call(LS, k); } catch (e) { return null; } };
  const s = (k, v) => { try { rawSet.call(LS, k, v); } catch (e) {} };
  const d = k => { try { rawDel.call(LS, k); } catch (e) {} };
  const ss = { get: k => { try { return SS.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { SS.setItem(k, v); } catch (e) {} }, del: k => { try { SS.removeItem(k); } catch (e) {} } };
  // 이 기기에서 마지막으로 고른 이름을 기억해요 (파일을 다시 열어도 그 이름으로 시작해요)
  const who = () => ss.get('sync-student') || (() => { const v = g('sync-last-student'); if (v) ss.set('sync-student', v); return v; })();
  const cacheKey = st => `sync-cache:${APP}:${st}`;
  const snapshot = () => { const o = {}; KEYS.forEach(k => { const v = g(k); if (v != null) o[k] = v; }); return o; };
  const apply = o => { KEYS.forEach(k => { if (o && o[k] != null) s(k, o[k]); else d(k); }); };

  // 앱이 진도를 저장할 때마다 학생 기록에도 저장
  let timer = null, state = '';
  Storage.prototype.setItem = function (k, v) {
    rawSet.call(this, k, v);
    if (this === LS && KEYS.includes(k) && who()) { s(cacheKey(who()), JSON.stringify(snapshot())); }
  };

  // ---------- 화면 ----------
  const css = `#sy-chip{position:fixed;left:8px;bottom:8px;z-index:20000;background:#fff;border:2px solid #cbd5e1;border-radius:99px;padding:4px 12px;font:15px 'Jua','Malgun Gothic',sans-serif;color:#334155;cursor:pointer;box-shadow:0 2px 6px #0002}
  #sy-ov{position:fixed;inset:0;z-index:20001;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;font-family:'Jua','Malgun Gothic',sans-serif}
  #sy-box{background:#fff;border-radius:26px;border:5px solid #fde047;padding:18px 22px;width:min(92vw,760px);max-height:90vh;overflow:auto;text-align:center}
  #sy-box h2{margin:4px 0 10px;font-weight:normal;font-size:30px;color:#1e3a8a}
  .sy-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
  .sy-names button,.sy-btn{font:22px 'Jua','Malgun Gothic',sans-serif;background:#f0f9ff;border:3px solid #7dd3fc;border-radius:16px;padding:10px 12px;cursor:pointer;color:#0c4a6e;white-space:nowrap}
  .sy-names button:hover{background:#e0f2fe}
  .sy-in{font:18px sans-serif;padding:8px;border-radius:10px;border:2px solid #cbd5e1;width:100%;box-sizing:border-box;margin:4px 0}
  .sy-small{font-size:15px;color:#64748b}
  .sy-red{background:#fef2f2!important;border-color:#fca5a5!important;color:#991b1b!important}`;
  const st0 = document.createElement('style'); st0.textContent = css; document.head.appendChild(st0);
  function setState(x) { state = x; chip(); }
  function chip() {
    let c = document.getElementById('sy-chip'); if (!c) { c = document.createElement('div'); c.id = 'sy-chip'; c.onclick = () => picker(); document.body.appendChild(c); }
    const icon = '📱';
    c.textContent = `👤 ${who() || '이름 고르기'} ${icon}`;
    c.title = '이 기기에만 저장해요';
  }
  function overlay(html) { let o = document.getElementById('sy-ov'); if (!o) { o = document.createElement('div'); o.id = 'sy-ov'; document.body.appendChild(o); } o.innerHTML = `<div id="sy-box">${html}</div>`; return o; }
  function close() { const o = document.getElementById('sy-ov'); if (o) o.remove(); }

  async function picker() {
    let names = []; try { names = JSON.parse(g('sync-students') || '[]'); } catch (e) {}
    overlay(`<h2>👋 누구예요?</h2><div class="sy-small" id="sy-msg">이름을 골라요</div><div class="sy-names" id="sy-names"></div>
      <div style="display:flex;gap:8px;margin-top:6px"><input class="sy-in" id="sy-new" placeholder="이름이 없으면 여기에 써요"><button class="sy-btn" id="sy-add">확인</button></div>
      <button class="sy-btn" id="sy-skip" style="margin-top:10px;width:100%;background:#fef9c3;border-color:#facc15;color:#713f12">🙂 이름 없이 시작해요</button>
      `);
    const draw = () => { document.getElementById('sy-names').innerHTML = names.map(n => `<button>${String(n).replace(/</g, '')}</button>`).join(''); document.querySelectorAll('#sy-names button').forEach(b => b.onclick = () => choose(b.textContent)); };
    draw();
    document.getElementById('sy-add').onclick = () => { const v = document.getElementById('sy-new').value.trim(); if (v) choose(v); };
    { const k = document.getElementById('sy-skip'); if (k) k.onclick = () => choose('친구'); }   // 키보드 없이 바로 시작 (진도는 '친구' 이름으로 이 기기에 저장)
    { const t = document.getElementById('sy-t'); if (t) t.onclick = teacher; }
  }
  async function choose(name) {
    overlay(`<h2>⏳ ${name} 진도를 불러오는 중…</h2>`);
    let data = null;
    if (data == null) { try { data = JSON.parse(g(cacheKey(name)) || 'null'); } catch (e) {} }
    apply(data || {}); s(cacheKey(name), JSON.stringify(data || {}));
    ss.set('sync-student', name); ss.set('sync-ready:' + APP, '1');
    s('sync-last-student', name);
    try { const L = JSON.parse(g('sync-students') || '[]'); if (!L.includes(name)) { L.push(name); s('sync-students', JSON.stringify(L)); } } catch (e) {}
    location.reload();
  }

  // ---------- 시작 ----------
  function start() {
    chip();
    if (!who()) picker();
    else if (!ss.get('sync-ready:' + APP)) choose(who());   // 다른 앱에서 이미 고른 학생이면 바로 불러와요
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0);
  window.SYNC = { picker, push: () => {}, who };
})();

</script>

let actx = null;
function ac() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} return actx; }
function tone(freq, t0, dur, type = 'sine', vol = .2, to) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), n = c.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(freq, n); if (to) o.frequency.exponentialRampToValueAtTime(to, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.001, n + dur);
  o.connect(g); g.connect(c.destination); o.start(n); o.stop(n + dur + .02);
}
function sndGood() { try { tone(587, 0, .35, 'sine', .2, 1760); tone(1175, .08, .25, 'triangle', .08); } catch (e) {} }
function sndGoat() {   // 틀렸을 때: 글자 없이 염소 소리
  try { const c = ac(); if (!c) return; const n = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(220, n); o.frequency.linearRampToValueAtTime(160, n + .15); o.frequency.linearRampToValueAtTime(280, n + .3); o.frequency.linearRampToValueAtTime(190, n + .45);
    g.gain.setValueAtTime(.18, n); g.gain.exponentialRampToValueAtTime(.001, n + .5); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n + .5); } catch (e) {}
}
function sndClear() { try { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .4, 'triangle', .18)); tone(1568, .55, .6, 'sine', .12); } catch (e) {} }

// 음성 안내
let sayTimer = null, sayToken = 0;
// 가장 자연스러운 한국어 목소리를 골라요 (엣지의 'Natural' 목소리가 가장 부드러워요)
let koVoices = [], koVoice = null;
function voiceScore(v) {
  const n = v.name;
  return (/natural|neural/i.test(n) ? 100 : 0) + (/online/i.test(n) ? 30 : 0) + (/sunhi|seohyeon|jimin|yuna|google/i.test(n) ? 20 : 0) + (/female|여/i.test(n) ? 3 : 0);
}
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  koVoices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
  koVoice = koVoices.find(v => v.name === settings.voiceName) || koVoices[0] || null;
  const sel = document.getElementById('voice-sel'); if (!sel) return;
  sel.innerHTML = koVoices.length ? koVoices.map(v => `<option value="${v.name}" ${koVoice && v.name === koVoice.name ? 'selected' : ''}>${v.name.replace(/Microsoft |Online |\(Natural\)/g, m => m === '(Natural)' ? '(자연스러운 목소리)' : '').replace(' - Korean (Korea)', '').trim()}</option>`).join('') : '<option>기본 목소리</option>';
  const tip = document.getElementById('voice-tip');
  if (tip) tip.textContent = koVoice && /natural|neural/i.test(koVoice.name) ? '✨ 자연스러운 목소리' : '💡 엣지(Edge)에서 열면 더 자연스러운 목소리가 나와요';
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); }
function speak(text, rate = 1) {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(unitKo(text)); u.lang = 'ko-KR';
    if (koVoice) u.voice = koVoice;
    const natural = koVoice && /natural|neural|online/i.test(koVoice.name);
    u.rate = (natural ? 0.95 : 0.9) * rate; u.pitch = 1.0; u.volume = 1;
    speechSynthesis.speak(u);
    // 말이 끝나는 때를 적어 둬요 (onend 가 안 오는 기기도 있어서 글 길이로 어림한 시간도 함께)
    sayBusyUntil = Date.now() + sayEst(text, rate);
    const fin = () => { if (sayCur === u) { sayCur = null; sayBusyUntil = Date.now(); } };
    sayCur = u; u.addEventListener('end', fin); u.addEventListener('error', fin);
    return u;
  } catch (e) {}
}
function stopSpeech() { sayToken++; clearTimeout(sayTimer); sayClear(); sayCur = null; sayBusyUntil = 0; try { speechSynthesis.cancel(); } catch (e) {} }
// ── 말 줄 세우기 ──
// 저절로 나오는 말(빨래 이름, 클리어 칭찬)은 하던 말을 끊지 않아요.
// 앞 말이 끝나고 2초 쉰 뒤에 읽어요. 너무 밀리면 오래된 말은 버려요. (🔊 단추는 speak() 로 바로 읽어요)
const SAY_GAP = 2000;
let sayQ = [], sayPump = null, sayCur = null, sayBusyUntil = 0;
function sayEst(text, rate) { return Math.max(1000, String(text).length * 190 / (rate || 1)) + 300; }
function sayClear() { sayQ = []; clearTimeout(sayPump); sayPump = null; }
function sayLater(text, rate = 1, max = 2) {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  if (sayQ.some(x => x.text === text)) return;          // 같은 말이 이미 기다리면 또 넣지 않아요
  sayQ.push({ text, rate }); while (sayQ.length > max) sayQ.shift();
  if (!sayPump) sayPump = setTimeout(sayTick, 0);
}
function sayTick() {
  sayPump = null; if (!sayQ.length) return;
  const now = Date.now(); let sp = false;
  try { sp = speechSynthesis.speaking || speechSynthesis.pending; } catch (e) {}
  if (sp) sayBusyUntil = Math.max(sayBusyUntil, now);
  if (sp || now < sayBusyUntil + SAY_GAP) { sayPump = setTimeout(sayTick, 150); return; }
  const x = sayQ.shift(); speak(x.text, x.rate);
  if (sayQ.length) sayPump = setTimeout(sayTick, 150);
}
function missionLoop() {   // 미션을 10초마다 반복해서 읽어 줘요
  const my = ++sayToken; clearTimeout(sayTimer);
  if (!MISSION_REPEAT_MS) return;   // 한 번만 안내: 게임 중에는 다시 읽지 않아요 (🔊 버튼으로 다시 듣기)
  const run = () => {
    if (my !== sayToken || !game.playing || game.paused) return;
    const u = speak(LEVELS[game.lv].mission, .97);
    const next = () => { if (my === sayToken) sayTimer = setTimeout(run, MISSION_REPEAT_MS); };
    if (u) { u.onend = next; setTimeout(() => { if (!speechSynthesis.speaking) next(); }, 9000); } else next();
  };
  run();
}

const itemsLayer = document.getElementById('items'), binsEl = document.getElementById('bins'), fx = document.getElementById('fx');
const game = { lv: 0, playing: false, paused: false, items: [], bins: [], center: W / 2, target: W / 2, count: 0, miss: 0, spawnT: 0, keys: 0 };

function chooseItem(L) {
  const r = Math.random();
  const pool = cat => ITEMS.filter(it => it.cat === cat && (!L.photo || it.photos.length));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  if (r < L.nowash) return pick(pool('nowash'));
  if (L.mode === 'color') return colorItem(Math.random() < .5, pick(COLOR_WEAR));
  let cats;
  if (L.mode === 'one') {
    if (Math.random() < (L.other || 0)) cats = ['water', 'dry', 'sneakers'].filter(c => c !== L.slots[0]);
    else cats = [L.slots[0]];
  } else if (L.mode === 'multi') cats = L.slots;
  else cats = ['water', 'dry', 'sneakers'];
  let arr = cats.flatMap(pool);
  if (L.tricky && Math.random() < .35) { const t = ITEMS.filter(it => it.tricky && it.photos.length); return pick(t); }
  return pick(arr);
}

// 받침을 보고 조사를 골라요 (은/는, 이에요/예요)
function hasBatchim(w) { for (let i = w.length - 1; i >= 0; i--) { const c = w.charCodeAt(i); if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 > 0; if (c >= 48 && c <= 57) return '013678'.includes(w[i]); } return false; }
const eunNeun = w => w + (hasBatchim(w) ? '은' : '는');
const iEyo = w => w + (hasBatchim(w) ? '이에요' : '예요');
// 맞혔을 때: 이름과 종류 ("한복, 세탁소에 맡기는 옷!")
function rightText(it) { const c = CATS[it.cat]; return c ? `${it.name}, ${c.say}!` : it.name; }
// 틀렸을 때: 왜 틀렸는지 ("사과는 빨래가 아니에요." / "코트는 보통 세탁소에 맡겨요.")
function wrongText(it) {
  if (it.why) return it.why;
  if (it.cat === 'nowash') return `${eunNeun(it.name)} 빨래가 아니에요.`;
  if (it.cat === 'dry') return `${eunNeun(it.name)} 보통 세탁소에 맡겨요.`;
  return `${eunNeun(it.name)} ${iEyo(CATS[it.cat].say)}.`;
}
function accepts(slotCat, item) {
  if (item.cat === 'nowash') return false;
  if (slotCat === 'all') return true;
  return slotCat === item.cat;
}

function setupBins() {
  const L = LEVELS[game.lv];
  binsEl.innerHTML = ''; game.bins = [];
  const n = L.slots.length;
  L.slots.forEach((cat, i) => {
    const el = document.createElement('div'); el.className = 'bin'; el.innerHTML = binSVG(cat);
    binsEl.appendChild(el);
    game.bins.push({ cat, el, off: (i - (n - 1) / 2) * BIN_GAP });
  });
  // 어느 바구니든 화면 끝에서 떨어지는 물건까지 받을 수 있는 범위
  const offs = game.bins.map(b => b.off);
  game.cMin = DROP_MIN - Math.max(...offs) - 10;
  game.cMax = DROP_MAX - Math.min(...offs) + 10;
  game.center = game.target = W / 2;
  placeBins();
}
function placeBins() { game.bins.forEach(b => { b.el.style.left = (game.center + b.off) + 'px'; }); }

function spawn() {
  const L = LEVELS[game.lv];
  const live = clouds.filter(c => !c.far && c.x + c.w * 0.5 > DROP_MIN + 30 && c.x + c.w * 0.5 < DROP_MAX - 30);
  const cl = live.length ? live[Math.floor(Math.random() * live.length)] : null;
  let x = cl ? cl.x + cl.w * (0.3 + Math.random() * 0.4) : DROP_MIN + Math.random() * (DROP_MAX - DROP_MIN);
  x = Math.max(DROP_MIN, Math.min(DROP_MAX, x));
  const y = cl ? cl.y + cl.w * 0.32 : 110;
  if (cl) { cl.el.classList.remove('drop'); void cl.el.offsetWidth; cl.el.classList.add('drop'); setTimeout(() => cl.el.classList.remove('drop'), 460); }

  const it = chooseItem(L);
  const el = document.createElement('div'); el.className = 'item';
  const fallback = artSVG(it);
  let inner;
  if (L.photo && it.photos.length) {
    const pid = it.photos[Math.floor(Math.random() * it.photos.length)];
    inner = `<div class="photo"><img src="${photoURL(pid)}" alt="${it.name}" onerror="this.parentNode.classList.add('fail')"><div class="fb">${fallback}</div></div>`;
  } else inner = `<div class="art">${fallback}</div>`;
  el.innerHTML = inner + `<div class="tag">${it.name}</div><svg class="xmark" viewBox="0 0 100 100"><path d="M20 20 L80 80 M80 20 L20 80" stroke="#fff" stroke-width="22" stroke-linecap="round"/><path d="M20 20 L80 80 M80 20 L20 80" stroke="#e53935" stroke-width="14" stroke-linecap="round"/></svg>`;
  itemsLayer.appendChild(el);
  game.items.push({ it, el, x, y, vy: 78 * L.speed * settings.speed, ph: Math.random() * 6.28, t: 0, state: 'fall' });
}

function photoURL(id) { return PHOTO_DATA[id] || ''; }

function step(dt) {
  const L = LEVELS[game.lv];
  // 바구니 움직임
  if (game.keys) game.target += game.keys * 560 * dt;
  game.target = Math.max(game.cMin, Math.min(game.cMax, game.target));
  game.center += (game.target - game.center) * Math.min(1, dt * 14);
  placeBins();

  // 물건 만들기
  game.spawnT -= dt;
  const falling = game.items.filter(i => i.state === 'fall').length;
  if (game.spawnT <= 0 && falling < L.maxOn) { spawn(); game.spawnT = (2.6 / L.speed) / (settings.speed / 0.75) * (0.85 + Math.random() * 0.3); }

  // 물건 떨어지기
  for (let i = game.items.length - 1; i >= 0; i--) {
    const o = game.items[i]; o.t += dt;
    if (o.state === 'fall') {
      const prev = o.y; o.y += o.vy * dt;
      const sway = Math.sin(o.t * 2.2 + o.ph) * 12, rot = Math.sin(o.t * 2.2 + o.ph + 1) * 9;
      const pop = Math.min(1, 0.35 + o.t * 2.2);
      o.dx = o.x + sway;
      o.el.style.transform = `translate(${o.dx}px, ${o.y - 60}px) rotate(${rot}deg) scale(${pop})`;
      // 바구니 입구를 지나는 순간 확인
      if (prev < RIM_Y && o.y >= RIM_Y) {
        const bin = game.bins.find(b => Math.abs(o.dx - (game.center + b.off)) <= 78);
        if (bin) { catchItem(o, bin); continue; }
      }
      if (o.y > 700) { o.state = 'gone'; o.el.style.transition = 'opacity .3s'; o.el.style.opacity = 0; setTimeout(() => o.el.remove(), 320); game.items.splice(i, 1); }
    }
  }
}

function catchItem(o, bin) {
  const ok = accepts(bin.cat, o.it);
  const bx = game.center + bin.off;
  if (ok) {
    o.state = 'in';
    o.el.style.transition = 'transform .32s ease-in, opacity .32s';
    o.el.style.transform = `translate(${bx}px, ${RIM_Y - 20}px) scale(.25)`; o.el.style.opacity = 0;
    setTimeout(() => o.el.remove(), 340);
    game.items.splice(game.items.indexOf(o), 1);
    face(bin.el, 'open', 'bounce'); sndGood(); sparkle(bx, RIM_Y); plusOne(bx, RIM_Y - 40);
    game.count++; updateHUD();
    const hc = $('hud-chr'); hc.classList.remove('cheer'); void hc.offsetWidth; hc.classList.add('cheer');
    if (settings.voice) sayLater(rightText(o.it), 1.05, 1);   // 이름과 종류를 말해요. 앞 말을 끊지 않고, 기다리는 말은 가장 새 것 하나만
    if (game.count >= LEVELS[game.lv].goal) setTimeout(stageClear, 450);
  } else {
    o.state = 'bounce'; o.el.classList.add('wrong'); game.miss++;
    if (settings.voice) sayLater(wrongText(o.it), 1, 1);   // 왜 틀렸는지 말해요 (기다리던 말보다 이것이 먼저)
    face(bin.el, 'sad', 'shake'); sndGoat();
    const dir = Math.random() < .5 ? -1 : 1;
    o.el.style.transition = 'transform .7s ease-out, opacity .7s';
    o.el.style.transform = `translate(${o.dx + dir * 140}px, ${RIM_Y - 200}px) rotate(${dir * 40}deg) scale(.8)`; o.el.style.opacity = 0;
    setTimeout(() => o.el.remove(), 720);
    game.items.splice(game.items.indexOf(o), 1);
  }
}
function face(el, mouth, anim) {
  el.classList.remove('open', 'sad', 'bounce', 'shake'); void el.offsetWidth;
  el.classList.add(mouth, anim);
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove(mouth, anim), 750);
}
function sparkle(x, y) {
  const cols = ['#ffd93b', '#ff8fb1', '#7fd0ff', '#8ff0a4', '#fff'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 60;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - 30) + 'px');
    s.innerHTML = `<svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 0 L12.5 7.5 L20 10 L12.5 12.5 L10 20 L7.5 12.5 L0 10 L7.5 7.5 Z" fill="${cols[i % cols.length]}"/></svg>`;
    fx.appendChild(s); setTimeout(() => s.remove(), 720);
  }
}
function plusOne(x, y) { const p = document.createElement('div'); p.className = 'plus'; p.textContent = '+1'; p.style.left = x + 'px'; p.style.top = y + 'px'; fx.appendChild(p); setTimeout(() => p.remove(), 1000); }

function toStageX(clientX) { const r = stage.getBoundingClientRect(); return (clientX - r.left) / scale; }
stage.addEventListener('pointermove', e => {
  if (!game.playing || game.paused || e.target.closest('button')) return;
  const px = Math.max(0, Math.min(W, toStageX(e.clientX)));
  game.target = game.cMin + (game.cMax - game.cMin) * (px / W);   // 화면 전체 너비 = 바구니가 갈 수 있는 전체 범위

const held = { l: false, r: false };

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { held.l = true; updKeys(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { held.r = true; updKeys(); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ') && $('intro').classList.contains('on')) { e.preventDefault(); startLevel(); }
  else if (e.key === 'Escape' || e.key === 'p') { if (game.playing && !game.paused) pauseGame(); else if (game.paused) resumeGame(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft') held.l = false; if (e.key === 'ArrowRight') held.r = false; updKeys(); });

});
