      - name: 스토어용 AAB 만들기
        if: steps.chg.outputs.apk == '1'
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: AAB 올리기 (내려받기 칸 store)
        if: steps.chg.outputs.apk == '1'
        shell: bash
        run: |
          set -e
          cp android/app/build/outputs/bundle/release/app-release.aab hyegwang-jeongwa-cho.aab
          gh release delete store -y --cleanup-tag >/dev/null 2>&1 || true
          sleep 3
          gh release create store hyegwang-jeongwa-cho.aab --title "초등 초승달 전과 플레이스토어 올림 파일" --latest=false \
            --notes "Play Console에 올리는 초등 초승달 전과 AAB 파일이에요. (만든 번호 ${{ github.run_number }}, versionCode $((1000 + ${{ github.run_number }}))) 칠판에 직접 까는 파일이 아니에요."
          rm -f android/signing/release.keystore

      - name: 작업 결과에도 남기기
        if: steps.chg.outputs.apk == '1'
        uses: actions/upload-artifact@v4
        with:
          name: hyegwang-jeongwa-cho-aab
          path: hyegwang-jeongwa-cho.aab
